  <style>
    /* === Modern Obsidian Theme === */
    :root {
      --font-primary: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;

      /* Light Mode Palette - Crisp & Clean */
      --bg-body: #f8fafc;
      --bg-content: #ffffff;
      --bg-sidebar: rgba(255, 255, 255, 0.8);
      --border-color: #e2e8f0;

      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;

      --accent-primary: #6366f1;
      /* Indigo 500 */
      --accent-hover: #4f46e5;
      /* Indigo 600 */
      --accent-subtle: rgba(99, 102, 241, 0.1);

      --code-bg: #f1f5f9;
      --code-text: #334155;

      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);

      /* Syntax Highlighting - Light */
      --syntax-keyword: #db2777;
      --syntax-string: #16a34a;
      --syntax-comment: #94a3b8;
      --syntax-function: #7c3aed;
      --syntax-variable: #ea580c;
      --syntax-number: #2563eb;

      --color-danger: #ef4444;
      --color-warning: #f59e0b;
      --color-success: #10b981;
    }

    /* Dark Mode Palette - Deep Slate */
    /* Dark Mode Palette - Midnight Pro */
    body.dark-theme {
      /* Deepest Slate/Black for background */
      --bg-body: #020617;
      /* Rich Slate for content */
      --bg-content: #0f172a;
      /* Glassmorphism base */
      --bg-sidebar: rgba(2, 6, 23, 0.85);
      /* Subtle borders */
      --border-color: #1e293b;

      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;

      /* Neon Sky Blue Accent */
      --accent-primary: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-subtle: rgba(56, 189, 248, 0.1);
      --accent-glow: 0 0 20px rgba(56, 189, 248, 0.25);

      /* Deep Code Background */
      --code-bg: #0b1120;
      --code-text: #e2e8f0;

      /* Stronger Shadows for depth */
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.5);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);

      /* Syntax Highlighting - Neon */
      --syntax-keyword: #f472b6;
      --syntax-string: #4ade80;
      --syntax-comment: #475569;
      --syntax-function: #c084fc;
      --syntax-variable: #fb923c;
      --syntax-number: #60a5fa;

      --color-danger: #f87171;
      --color-warning: #fbbf24;
      --color-success: #34d399;
    }

    /* Global Styles */
    body {
      background-color: var(--bg-body);
      color: var(--text-primary);
      font-family: var(--font-primary);
      transition: background-color 0.3s ease, color 0.3s ease;
      letter-spacing: -0.01em;
    }

    body.dark-theme {
      color: var(--text-primary) !important;
    }

    body.dark-theme * {
      color: inherit;
    }

    /* Sidebar - Glassmorphism */
    .sidebar {
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }

    /* Sidebar Navigation with Color Hierarchy */
    .sidebar-nav>ul>li>a {
      font-weight: 600;
      color: var(--accent-primary) !important;
      font-size: 0.95rem;
    }

    .sidebar-nav li a {
      color: var(--text-primary) !important;
      transition: all 0.2s ease;
      border-radius: 6px;
      padding: 4px 8px;
      margin: 2px 0;
    }

    /* Level 2 - Sub headers */
    .sidebar-nav ul ul li>a {
      color: var(--text-secondary) !important;
      font-size: 0.9rem;
    }

    /* Level 3 - Sub-sub headers */
    .sidebar-nav ul ul ul li>a {
      color: var(--text-tertiary) !important;
      font-size: 0.88rem;
      padding-left: 16px;
    }

    /* Dark theme colors */
    body.dark-theme .sidebar-nav>ul>li>a {
      color: var(--accent-primary) !important;
    }

    body.dark-theme .sidebar-nav ul ul li>a {
      color: var(--text-secondary) !important;
    }

    body.dark-theme .sidebar-nav ul ul ul li>a {
      color: var(--text-tertiary) !important;
    }

    /* Hover state */
    .sidebar-nav li a:hover {
      color: var(--accent-primary) !important;
      background-color: var(--accent-subtle);
      text-decoration: none;
    }

    .app-name-link {
      color: var(--accent-primary) !important;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* Content Area */
    .content {
      background-color: transparent;
      padding-top: 1rem;
    }

    .markdown-section {
      background-color: var(--bg-content);
      padding: 3rem;
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      max-width: 900px;
      margin: 0 auto 4rem auto;
      color: var(--text-primary);
    }

    /* Typography */
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      color: var(--text-primary);
      font-weight: 700;
      letter-spacing: -0.02em;
      border-bottom: none;
    }

    .markdown-section h1 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    .markdown-section h2 {
      font-size: 1.75rem;
      margin-top: 2.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--accent-primary);
    }

    .markdown-section h3 {
      color: var(--text-primary);
    }

    .markdown-section h4 {
      color: var(--text-primary);
    }

    .markdown-section h5 {
      color: var(--text-primary);
    }

    body.dark-theme .markdown-section h2 {
      color: var(--accent-primary);
    }

    .markdown-section a {
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid transparent;
      transition: all 0.2s;
    }

    .markdown-section a:hover {
      border-bottom-color: var(--accent-primary);
    }

    /* Code Blocks - Premium Theme */
    .markdown-section pre {
      background-color: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05);
      overflow-x: auto;
      position: relative;
    }

    .markdown-section code {
      background-color: var(--code-bg);
      color: var(--code-text);
      border-radius: 6px;
      padding: 0.2em 0.4em;
      font-family: "JetBrains Mono", "Fira Code", "Consolas", monospace;
      font-size: 0.9em;
    }

    .markdown-section pre>code {
      background-color: transparent;
      padding: 0;
      color: var(--code-text);
      font-size: 0.875rem;
      line-height: 1.6;
    }

    /* Syntax Highlighting - Light Mode */
    .markdown-section pre code .token.comment,
    .markdown-section pre code .token.prolog,
    .markdown-section pre code .token.doctype,
    .markdown-section pre code .token.cdata {
      color: var(--syntax-comment);
      font-style: italic;
    }

    .markdown-section pre code .token.keyword,
    .markdown-section pre code .token.tag,
    .markdown-section pre code .token.boolean,
    .markdown-section pre code .token.important {
      color: var(--syntax-keyword);
      font-weight: 600;
    }

    .markdown-section pre code .token.string,
    .markdown-section pre code .token.attr-value {
      color: var(--syntax-string);
    }

    .markdown-section pre code .token.function,
    .markdown-section pre code .token.class-name {
      color: var(--syntax-function);
      font-weight: 500;
    }

    .markdown-section pre code .token.number,
    .markdown-section pre code .token.constant {
      color: var(--syntax-number);
    }

    .markdown-section pre code .token.variable,
    .markdown-section pre code .token.property {
      color: var(--syntax-variable);
    }

    .markdown-section pre code .token.operator,
    .markdown-section pre code .token.punctuation {
      color: var(--text-secondary);
    }

    .markdown-section pre code .token.annotation,
    .markdown-section pre code .token.decorator {
      color: #d97706;
    }

    /* Dark Mode Syntax Highlighting */
    body.dark-theme .markdown-section pre code .token.comment,
    body.dark-theme .markdown-section pre code .token.prolog,
    body.dark-theme .markdown-section pre code .token.doctype,
    body.dark-theme .markdown-section pre code .token.cdata {
      color: var(--syntax-comment);
      font-style: italic;
    }

    body.dark-theme .markdown-section pre code .token.keyword,
    body.dark-theme .markdown-section pre code .token.tag,
    body.dark-theme .markdown-section pre code .token.boolean,
    body.dark-theme .markdown-section pre code .token.important {
      color: var(--syntax-keyword);
      font-weight: 600;
    }

    body.dark-theme .markdown-section pre code .token.string,
    body.dark-theme .markdown-section pre code .token.attr-value {
      color: var(--syntax-string);
    }

    body.dark-theme .markdown-section pre code .token.function,
    body.dark-theme .markdown-section pre code .token.class-name {
      color: var(--syntax-function);
      font-weight: 500;
    }

    body.dark-theme .markdown-section pre code .token.number,
    body.dark-theme .markdown-section pre code .token.constant {
      color: var(--syntax-number);
    }

    body.dark-theme .markdown-section pre code .token.variable,
    body.dark-theme .markdown-section pre code .token.property {
      color: var(--syntax-variable);
    }

    body.dark-theme .markdown-section pre code .token.operator,
    body.dark-theme .markdown-section pre code .token.punctuation {
      color: #94a3b8;
    }

    body.dark-theme .markdown-section pre code .token.annotation,
    body.dark-theme .markdown-section pre code .token.decorator {
      color: #fbbf24;
    }

    /* Blockquotes */
    .markdown-section blockquote {
      border-left: 4px solid var(--accent-primary);
      background-color: var(--accent-subtle);
      color: var(--text-secondary);
      border-radius: 0 8px 8px 0;
      padding: 1rem 1.5rem;
      margin: 1.5rem 0;
    }

    /* Tables */
    .table-wrapper {
      overflow-x: auto;
      width: 100%;
      margin: 2rem 0;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      border-spacing: 0;
      border: none;
      margin: 0;
    }

    .markdown-section table th {
      background-color: var(--bg-body);
      color: var(--text-primary);
      font-weight: 600;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }

    .markdown-section table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .markdown-section table tr:last-child td {
      border-bottom: none;
    }

    .markdown-section table tr:hover td {
      background-color: var(--accent-subtle);
    }

    /* Search Box */
    .search input {
      background-color: var(--bg-body);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      padding: 10px 16px;
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
    }

    .search input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-subtle);
      outline: none;
    }

    /* Search Results */
    .search .results-panel {
      background: var(--bg-content);
      border: 1px solid var(--border-color);
    }

    .search .results-panel p,
    .search .results-panel em {
      color: var(--text-primary) !important;
    }

    body.dark-theme .search .results-panel p,
    body.dark-theme .search .results-panel em {
      color: var(--text-primary) !important;
    }

    /* Pagination */
    .docsify-pagination-container {
      margin-top: 4rem;
      border-top: 1px solid var(--border-color);
      padding-top: 2rem;
    }

    .pagination-item a {
      color: var(--text-primary) !important;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 20px;
      transition: all 0.2s;
      background-color: var(--bg-content);
    }

    .pagination-item a:hover {
      border-color: var(--accent-primary);
      background-color: var(--bg-body);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    /* Dark Theme Button Hover Effects */
    body.dark-theme .theme-toggle:hover,
    body.dark-theme .scroll-to-top:hover {
      box-shadow: var(--accent-glow);
      border-color: var(--accent-primary);
    }

    /* Override any #34495e from Vue theme */
    .sidebar-toggle,
    .sidebar-toggle-button {
      background-color: transparent !important;
      color: var(--text-primary) !important;
    }

    body.dark-theme .sidebar-toggle,
    body.dark-theme .sidebar-toggle-button {
      color: var(--text-primary) !important;
    }

    /* Pagination buttons - GitHub style instead of #34495e */
    .pagination-item a {
      color: var(--accent-primary) !important;
    }

    .pagination-item a:hover {
      background-color: var(--code-bg) !important;
      color: var(--accent-primary) !important;
    }

    body.dark-theme .pagination-item a:hover {
      background-color: var(--code-bg) !important;
    }

    /* Cover page if used */
    .cover h1,
    .cover h2 {
      color: var(--text-primary) !important;
    }

    body.dark-theme .cover h1,
    body.dark-theme .cover h2 {
      color: var(--text-primary) !important;
    }

    /* Anchor links */
    .anchor span {
      color: var(--accent-primary) !important;
    }



    body.dark-theme .keyboard-shortcuts {
      background: var(--code-bg);
      border-color: var(--border-color);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4),
        0 0 0 1px var(--border-color);
    }

    /* === UI Elements === */

    /* Theme Toggle Button */
    .theme-toggle {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--bg-content);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      cursor: pointer;
      box-shadow: var(--shadow-lg);
      z-index: 999;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .theme-toggle:hover {
      background: var(--bg-body);
      transform: translateY(-2px);
      color: var(--accent-primary);
      box-shadow: 0 12px 20px -3px rgb(0 0 0 / 0.15);
    }

    /* Scroll to Top Button */
    .scroll-to-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--accent-primary);
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: var(--shadow-lg);
      z-index: 999;
      font-size: 24px;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .scroll-to-top:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 20px -3px rgb(0 0 0 / 0.15);
    }

    .scroll-to-top.show {
      display: flex;
    }

    /* Reading Progress Bar */
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: var(--accent-primary);
      z-index: 9999;
      transition: width 0.2s ease;
    }

    /* Loading Animation */
    #app {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app:empty::before {
      content: "";
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-color);
      border-top: 3px solid var(--accent-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Keyboard Shortcuts Indicator */
    .keyboard-shortcuts {
      position: fixed;
      bottom: 150px;
      right: 20px;
      background: var(--bg-content);
      color: var(--text-primary);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 12px;
      display: none;
      z-index: 998;
      max-width: 220px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
    }

    .keyboard-shortcuts.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .keyboard-shortcuts kbd {
      background: var(--code-bg);
      color: var(--code-text);
      padding: 3px 7px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      border: 1px solid var(--border-color);
      box-shadow: inset 0 -1px 0 var(--border-color);
    }

    /* Offline Indicator */
    .offline-indicator {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: var(--color-warning);
      color: var(--bg-body);
      padding: 8px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      z-index: 9998;
      display: none;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    .offline-indicator.show {
      display: block;
    }

    body.dark-theme .offline-indicator {
      background: var(--color-warning);
      color: var(--code-bg);
      border-bottom: 1px solid var(--border-color);
    }

    /* Mobile Responsive Adjustments */
    @media screen and (max-width: 768px) {

      .theme-toggle,
      .scroll-to-top {
        width: 45px;
        height: 45px;
        font-size: 18px;
        right: 15px;
      }

      .theme-toggle {
        bottom: 75px;
      }

      .scroll-to-top {
        bottom: 15px;
      }

      .keyboard-shortcuts {
        display: none !important;
      }

      .markdown-section {
        font-size: 15px;
        padding: 2rem 1rem;
      }

      .markdown-section pre>code {
        font-size: 0.85em;
      }
    }

    /* Print Styles */
    @media print {

      .sidebar,
      .theme-toggle,
      .scroll-to-top,
      .progress-bar,
      .keyboard-shortcuts,
      .docsify-pagination-container {
        display: none !important;
      }

      .content {
        left: 0 !important;
        max-width: 100% !important;
      }

      .markdown-section {
        max-width: 100% !important;
        padding: 0 !important;
      }

      .markdown-section pre>code {
        white-space: pre-wrap !important;
        word-wrap: break-word !important;
      }

      body.dark-theme {
        background-color: white !important;
        color: black !important;
      }

      body.dark-theme .markdown-section {
        color: black !important;
      }

      body.dark-theme .markdown-section h1,
      body.dark-theme .markdown-section h2,
      body.dark-theme .markdown-section h3 {
        color: black !important;
      }

      a {
        color: var(--accent-primary) !important;
      }
    }

    /* Lists */
    .markdown-section ul,
    .markdown-section ol {
      padding-left: 2em;
    }

    .markdown-section li {
      margin: 0.25em 0;
      color: var(--text-primary);
    }

    .markdown-section li strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Task Lists */
    .markdown-section input[type="checkbox"] {
      margin-right: 0.5em;
    }

    /* Alerts/Callouts */
    .markdown-section .tip,
    .markdown-section .warn,
    .markdown-section .danger {
      padding: 12px 16px;
      border-left: 4px solid;
      border-radius: 6px;
      margin: 16px 0;
    }

    .markdown-section .tip {
      background-color: rgba(26, 127, 55, 0.1);

    }

    .markdown-section .warn {
      background-color: rgba(154, 103, 0, 0.1);
      border-left-color: var(--color-warning);
    }

    .markdown-section .danger {
      background-color: rgba(209, 36, 47, 0.1);
      border-left-color: var(--color-danger);
    }

    body.dark-theme .markdown-section .tip {
      background-color: rgba(63, 185, 80, 0.15);
    }

    body.dark-theme .markdown-section .warn {
      background-color: rgba(210, 153, 34, 0.15);
    }

    body.dark-theme .markdown-section .danger {
      background-color: rgba(248, 81, 73, 0.15);
    }

    /* Smooth scrolling for all browsers */
    html {
      scroll-behavior: smooth;
    }

    /* Selection color */
    ::selection {
      background-color: #0969da;
      background-color: rgba(9, 105, 218, 0.25);
    }

    ::-moz-selection {
      background-color: #0969da;
      background-color: rgba(9, 105, 218, 0.25);
    }

    body.dark-theme ::selection {
      background-color: rgba(47, 129, 247, 0.25);
    }

    body.dark-theme ::-moz-selection {
      background-color: rgba(47, 129, 247, 0.25);
    }



    /* === UX/UI Enhancements === */

    /* Smooth Page Transitions */
    .markdown-section {
      animation: fadeSlideIn 0.4s ease-out;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;

    body.dark-theme .search input {

    /* Docsify Copy Code Plugin Overrides */
    .docsify-copy-code-button {

    /* PWA Install Banner */
    .pwa-install-banner {
      position: fixed;

      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-content);

    .pwa-install-banner.show {

    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }

        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    .pwa-install-content {
      flex: 1;

    }

    .pwa-install-content h4 {
      margin: 0 0 8px 0;
      font-size: 16px;

      color: var(--text-primary);
    }

    .pwa-install-content p {
      margin: 0;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .pwa-install-buttons {
      display: flex;
      gap: 8px;
    }

    .pwa-install-buttons button {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;

    .pwa-install-buttons .install-btn {
      background: var(--accent-primary);

    .pwa-install-buttons .install-btn:hover {
      background: var(--accent-hover);

      box-shadow: var(--shadow-md);
    }

    .pwa-install-buttons .dismiss-btn {
      background: var(--bg-body);

    }

    .pwa-install-buttons .dismiss-btn:hover {
      background: var(--accent-subtle);

    body.dark-theme .pwa-install-banner {

    /* PWA Update Toast */
    .pwa-update-toast {

    @keyframes slideIn {

        transform: translateX(100%);
      }

      to {

        transform: translateX(0);
      }
    }

    .pwa-update-toast span {

      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    /* Mobile adjustments for PWA banner */
    @media screen and (max-width: 768px) {
      .pwa-install-banner {
        flex-direction: column;
        gap: 10px;

      .pwa-install-content {
        margin-right: 0;
      }

      .pwa-install-buttons {
        width: 100%;
        justify-content: stretch;

      .pwa-install-buttons button {
        flex: 1;
      }

      .pwa-update-toast {
        top: 10px;
        right: 10px;
        left: 10px;
        max-width: none;
      }
    }
  </style>
</head>

<body>
  <!-- Offline Indicator -->
  <div class="offline-indicator" id="offlineIndicator">
    📡 You're offline - Content loaded from cache
  </div>

  <!-- Reading Progress Bar -->
  <div class="progress-bar" id="progressBar"></div>

  <div id="app">Loading...</div>

  <!-- PWA Install Banner -->
  <div class="pwa-install-banner" id="pwaInstallBanner">
    <div class="pwa-install-content">

      <p>Get offline access and app-like experience on your device!</p>

        Maybe Later
      </button>

  </div>

  <!-- PWA Update Toast -->
  <div class="pwa-update-toast" id="pwaUpdateToast">
    <span>🔄 New version available!</span>
    <button onclick="updatePWA()">Update</button>
  </div>

  <!-- Theme Toggle Button -->

    aria-label="Toggle theme">

  </button>

  <!-- Scroll to Top Button -->

  <!-- Keyboard Shortcuts Help -->

    <kbd>Ctrl+K</kbd> Search<br />

    <kbd>Home</kbd> Scroll to top
  </div>

  <script>
    window.$docsify = {
      name: "📚 Interview Notes",
      repo: "", // Add your GitHub repo URL here if you want a GitHub corner
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: "README.md",

      // Use root sidebar for all pages to avoid 404 warnings
      alias: {
        "/.*/_sidebar.md": "/_sidebar.md",
      },

      // Search plugin configuration
      search: {
        maxAge: 86400000, // Expiration time, default one day
        paths: "auto",
        placeholder: "🔍 Search topics...",
        noData: "No results found!",
        depth: 6,
        hideOtherSidebarContent: false,
      },

      // Pagination
      pagination: {
        previousText: "← Previous",
        nextText: "Next →",
        crossChapter: true,
        crossChapterText: true,
      },

        errorText: "Error",
        successText: "✓ Copied!",
      },

      // GitHub theme color
      themeColor: "#0969da",

      // Footer
      plugins: [
        function (hook, vm) {
          hook.beforeEach(function (html) {
            return html;
          });
          hook.afterEach(function (html, next) {
            // Footer
            const footer = [
              '<footer style="text-align: center; margin-top: 4rem; padding: 2rem 0; border-top: 1px solid var(--border-color); color: var(--text-tertiary); font-size: 0.9rem;">',
              '<span>Made with ❤️ by Interview Notes</span>',
              '<div style="margin-top: 0.5rem;">',
              '&copy; ' + new Date().getFullYear() + ' All Rights Reserved.',
              '</div>',
              '</footer>'
            ].join('');

            next(html + footer);
          });
          hook.doneEach(function () {
            // Wrap tables for responsiveness
            const tables = document.querySelectorAll(".markdown-section table");
            tables.forEach((table) => {
              if (!table.parentElement.classList.contains("table-wrapper")) {
                const wrapper = document.createElement("div");
                wrapper.className = "table-wrapper";
                table.parentNode.insertBefore(wrapper, table);
                wrapper.appendChild(table);
              }
            });
          });
        },
      ],
    };
  </script>

  <!-- Docsify core -->

  <!-- Custom JavaScript for Theme Toggle and Scroll to Top -->
  <script>
    // Theme Toggle Functionality
    function toggleTheme() {
      const body = document.body;
      const themeIcon = document.getElementById("theme-icon");

      body.classList.toggle("dark-theme");

      // Update icon
      if (body.classList.contains("dark-theme")) {
        themeIcon.textContent = "☀️";
        localStorage.setItem("theme", "dark");
      } else {
        themeIcon.textContent = "🌙";
        localStorage.setItem("theme", "light");
      }
    }

    // Load saved theme preference
    window.addEventListener("DOMContentLoaded", function () {
      const savedTheme = localStorage.getItem("theme");
      const themeIcon = document.getElementById("theme-icon");

      if (savedTheme === "dark") {
        document.body.classList.add("dark-theme");
        themeIcon.textContent = "☀️";
      }
    });

    // Scroll to Top Functionality
    function scrollToTop() {
      window.scrollTo({
        top: 0,
        behavior: "smooth",
      });
    }

    // Reading Progress Bar
    function updateProgressBar() {
      const progressBar = document.getElementById("progressBar");
      const windowHeight = window.innerHeight;
      const documentHeight = document.documentElement.scrollHeight;
      const scrollTop =
        window.pageYOffset || document.documentElement.scrollTop;
      const scrollPercent =
        (scrollTop / (documentHeight - windowHeight)) * 100;

      if (progressBar) {
        progressBar.style.width = scrollPercent + "%";
      }
    }

    // Show/Hide Scroll to Top button based on scroll position
    window.addEventListener("scroll", function () {
      const scrollBtn = document.querySelector(".scroll-to-top");
      if (window.pageYOffset > 300) {
        scrollBtn.classList.add("show");
      } else {
        scrollBtn.classList.remove("show");
      }

      // Update progress bar
      updateProgressBar();
    });

    // Also handle scroll for content area (Docsify specific)
    window.addEventListener("load", function () {
      const content = document.querySelector(".content");
      if (content) {
        content.addEventListener("scroll", function () {
          const scrollBtn = document.querySelector(".scroll-to-top");
          if (content.scrollTop > 300) {
            scrollBtn.classList.add("show");
          } else {
            scrollBtn.classList.remove("show");
          }
        });
      }

      // Initial progress bar update
      updateProgressBar();
    });

    // Keyboard Shortcuts
    let keyboardHelpTimeout;
    document.addEventListener("keydown", function (e) {
      // T key - Toggle theme
      if (e.key === "t" || e.key === "T") {
        if (!isInputFocused()) {
          e.preventDefault();
          toggleTheme();
        }
      }

      // Ctrl+K or Cmd+K - Focus search
      if ((e.ctrlKey || e.metaKey) && e.key === "k") {
        e.preventDefault();
        const searchInput = document.querySelector(".search input");
        if (searchInput) {
          searchInput.focus();
        }
      }

      // ? key - Show keyboard shortcuts
      if (e.key === "?") {
        if (!isInputFocused()) {
          e.preventDefault();
          const helpBox = document.getElementById("keyboardHelp");
          helpBox.classList.add("show");

          clearTimeout(keyboardHelpTimeout);
          keyboardHelpTimeout = setTimeout(function () {
            helpBox.classList.remove("show");
          }, 5000);
        }
      }

      // Home key - Scroll to top
      if (e.key === "Home") {
        if (!isInputFocused()) {
          e.preventDefault();
          scrollToTop();
        }
      }

      // Escape - Close keyboard help
      if (e.key === "Escape") {
        const helpBox = document.getElementById("keyboardHelp");
        helpBox.classList.remove("show");
      }
    });

    // Helper function to check if input is focused
    function isInputFocused() {
      const activeElement = document.activeElement;
      return (
        activeElement.tagName === "INPUT" ||
        activeElement.tagName === "TEXTAREA" ||
        activeElement.isContentEditable
      );
    }

    // Show keyboard shortcuts on first visit
    window.addEventListener("load", function () {
      setTimeout(function () {
        const firstVisit = !localStorage.getItem("visited");
        if (firstVisit) {
          const helpBox = document.getElementById("keyboardHelp");
          helpBox.classList.add("show");
          localStorage.setItem("visited", "true");

          setTimeout(function () {
            helpBox.classList.remove("show");
          }, 7000);
        }
      }, 2000);
    });

    // Performance optimization: Debounce scroll events
    let scrollTimeout;
    window.addEventListener(
      "scroll",
      function () {
        if (scrollTimeout) {
          window.cancelAnimationFrame(scrollTimeout);
        }
        scrollTimeout = window.requestAnimationFrame(function () {
          updateProgressBar();
        });
      },
      { passive: true }
    );
  </script>

  <!-- PWA Service Worker Registration and Management -->
  <script>
    // PWA Install Banner Management
    let deferredPrompt;
    const installBanner = document.getElementById("pwaInstallBanner");
    const updateToast = document.getElementById("pwaUpdateToast");
    const offlineIndicator = document.getElementById("offlineIndicator");

    // Capture install prompt event
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;

      // Show install banner if not dismissed before
      const installDismissed = localStorage.getItem("pwa-install-dismissed");
      const installDismissedTime = localStorage.getItem(
        "pwa-install-dismissed-time"
      );

      // Show banner if never dismissed, or if dismissed more than 7 days ago
      if (
        !installDismissed ||
        (installDismissedTime &&
          Date.now() - parseInt(installDismissedTime) >
          7 * 24 * 60 * 60 * 1000)
      ) {
        setTimeout(() => {
          installBanner.classList.add("show");
        }, 5000); // Show after 5 seconds
      }
    });

    // Install PWA function
    window.installPWA = async function () {
      if (!deferredPrompt) {
        console.log("Install prompt not available");
        return;
      }

      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;

      if (outcome === "accepted") {
        console.log("PWA installed successfully");
        localStorage.setItem("pwa-installed", "true");
      }

      deferredPrompt = null;
      installBanner.classList.remove("show");
    };

    // Dismiss install banner
    window.dismissInstallBanner = function () {
      installBanner.classList.remove("show");
      localStorage.setItem("pwa-install-dismissed", "true");
      localStorage.setItem(
        "pwa-install-dismissed-time",
        Date.now().toString()
      );
    };

    // Check if app is already installed
    window.addEventListener("appinstalled", () => {
      console.log("PWA was installed");
      localStorage.setItem("pwa-installed", "true");
      installBanner.classList.remove("show");

      // Show success message
      setTimeout(() => {
        alert(
          "✅ Interview Notes installed successfully! You can now access it from your home screen."
        );
      }, 500);
    });

    // Service Worker Registration
    if ("serviceWorker" in navigator) {
      let refreshing = false;

      navigator.serviceWorker
        .register("./sw.js")
        .then((registration) => {
          console.log("Service Worker registered:", registration);

          // Check for updates periodically
          setInterval(() => {
            registration.update();
          }, 60 * 60 * 1000); // Check every hour

          // Handle service worker updates
          registration.addEventListener("updatefound", () => {
            const newWorker = registration.installing;

            newWorker.addEventListener("statechange", () => {
              if (
                newWorker.state === "installed" &&
                navigator.serviceWorker.controller
              ) {
                // New service worker available
                updateToast.classList.add("show");

                // Auto-hide after 30 seconds
                setTimeout(() => {
                  updateToast.classList.remove("show");
                }, 30000);
              }
            });
          });
        })
        .catch((error) => {
          console.error("Service Worker registration failed:", error);
        });

      // Handle service worker controlling the page
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }

    // Update PWA function
    window.updatePWA = function () {
      updateToast.classList.remove("show");

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistration().then((registration) => {
          if (registration && registration.waiting) {
            // Tell the waiting service worker to skip waiting
            registration.waiting.postMessage({ type: "SKIP_WAITING" });
          }
        });
      }
    };

    // Online/Offline Detection
    function updateOnlineStatus() {
      if (navigator.onLine) {
        offlineIndicator.classList.remove("show");
      } else {
        offlineIndicator.classList.add("show");
      }
    }

    window.addEventListener("online", updateOnlineStatus);
    window.addEventListener("offline", updateOnlineStatus);
    updateOnlineStatus(); // Check initial status

    // iOS standalone mode detection
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isStandalone =
      window.navigator.standalone === true ||
      window.matchMedia("(display-mode: standalone)").matches;

    if (isIOS && !isStandalone) {
      // Show iOS-specific install instructions if needed
      const installDismissed = localStorage.getItem("pwa-install-dismissed");
      if (!installDismissed) {
        setTimeout(() => {
          const iosBanner = document.getElementById("pwaInstallBanner");
          if (iosBanner && !iosBanner.classList.contains("show")) {
            iosBanner.querySelector("p").textContent =
              'Tap the Share button below and select "Add to Home Screen"';
            iosBanner.querySelector(".install-btn").textContent = "Got it";
            iosBanner.classList.add("show");
          }
        }, 7000);
      }
    }

    // Cache statistics (for debugging)
    if ("serviceWorker" in navigator && "caches" in window) {
      caches.keys().then((cacheNames) => {
        console.log("Active caches:", cacheNames);
      });
    }

    // Display standalone mode indicator
    if (isStandalone) {
      console.log("🎉 Running in standalone mode (PWA)");
      document.body.classList.add("pwa-mode");
    }

    // Prevent zoom on double-tap for better app experience (mobile)
    let lastTouchEnd = 0;
    document.addEventListener(
      "touchend",
      function (event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      },
      false
    );
  </script>
